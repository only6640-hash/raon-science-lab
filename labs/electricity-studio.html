nt-size:14px;line-height:1.7}.note{font-size:13px;color:#566f7d;line-height:1.7;border-top:1px solid #e2ecec;padding-top:13px;margin-top:16px}.record{background:#fff;border:1px solid #d6e0e6;border-radius:9px;padding:10px 12px;margin-top:13px}.record:hover{background:#f0f8f7}.records{font-size:12px;line-height:1.7;color:#5b6e7c;max-height:160px;overflow:auto}.more{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 34px}.more a{border-radius:10px;padding:11px 14px;text-decoration:none;background:#e5edfa;color:#254c72;font-weight:700;font-size:13px}.sources{color:#617584;font-size:12px;line-height:1.8;margin:0 0 30px}.sources a{color:#176d70}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}.tabs button{flex:1 1 145px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><a href="../electricity/">← 전기·자기 탐구 지도</a><h1>전기·전자 탐구 스튜디오</h1><p>조건을 바꿔보고, 변화를 관찰하고, 숫자로 검증하는 52개의 가상실험</p></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div class="layout"><section class="panel"><div class="eyebrow" id="badge">EXPERIMENT 01</div><h2 id="title"></h2><p class="sub" id="summary"></p><div id="topicRef" hidden style="background:#e6f5f1;border-left:4px solid #177c75;border-radius:8px;padding:11px 15px;margin-bottom:14px;font-size:13px;color:#235550"></div><canvas id="scene" width="760" height="430" aria-label="과학 원리 시각화"></canvas><p class="legend" id="legend"></p></section><aside class="panel"><div class="eyebrow">CHANGE & OBSERVE</div><h2 style="font-size:19px">실험 조건</h2><div id="controls"></div><div class="metrics" id="metrics"></div><div class="question" id="question"></div><div class="note" id="note"></div><button class="record" id="record">＋ 지금 결과 기록</button><div class="records" id="records"></div></aside></div><div class="more"><a href="./circuit-builder.html">전구·전지 회로 조립하기 ↗</a><a href="../electricity/">전체 전기·자기 개념 목록 ↗</a></div><p class="sources">과학 검토 기준: <a href="https://openstax.org/books/university-physics-volume-2/pages/5-4-electric-field" target="_blank" rel="noopener">전기장</a> · <a href="https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits" target="_blank" rel="noopener">RC 회로</a> · <a href="https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law" target="_blank" rel="noopener">전자기 유도</a>. 교육용 이상화 모형이며 실제 기기 성능을 예측하는 용도가 아닙니다.</p></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#scene'),g=canvas.getContext('2d'),W=760,H=430,PI=Math.PI,mu=4*PI*1e-7;
const experiments=[
{id:'charge',title:'전하 사이의 보이지 않는 힘',label:'01 · 정전기',summary:'두 점전하의 부호·크기·거리를 바꾸며 인력과 척력을 살펴봅니다.',legend:'빨강은 양전하(+), 파랑은 음전하(−)입니다. 화살표는 전하가 받는 힘의 방향입니다.',controls:[['q1','왼쪽 전하 (μC)',-5,5,1,2],['q2','오른쪽 전하 (μC)',-5,5,1,-2],['r','거리 (cm)',10,60,1,30]],question:'전하의 크기는 그대로 두고 거리를 두 배로 하면 힘은 몇 배가 될까요?',note:'점전하·진공의 쿨롱 법칙 F = k|q₁q₂|/r². 값이 0인 전하는 전기력을 받지 않습니다.'},
{id:'field',title:'전류가 만드는 자기장',label:'02 · 자기',summary:'긴 직선 도선 주변의 자기장 크기와 방향을 관찰합니다.',legend:'중앙 기호 ⊙는 화면 밖으로 향하는 전류, ⊗는 화면 안으로 향하는 전류입니다.',controls:[['current','전류 (A)',-10,10,1,5],['distance','관찰 거리 (cm)',1,25,1,8]],question:'전류 방향을 거꾸로 바꾸면 나침반 바늘은 어떤 방향으로 회전할까요?',note:'무한히 긴 직선 도선·진공 근사 B = μ₀|I|/(2πr). 전류 0이면 이 도선이 만드는 자기장은 0입니다.'},
{id:'induction',title:'자속 변화와 유도 기전력',label:'03 · 전자기 유도',summary:'코일을 통과하는 자기장이 시간에 따라 변할 때 유도 기전력이 생깁니다.',legend:'그래프는 자속 밀도 B(t)와 유도 기전력 ε(t)의 위상 차이를 나타냅니다.',controls:[['turns','코일 감은 수 N',10,200,10,80],['area','코일 면적 (cm²)',5,80,5,30],['peak','자기장 진폭 (mT)',10,200,10,100],['freq','변화 진동수 (Hz)',0,5,0.5,1]],question:'자기장이 변하지 않을 때도 코일에 유도 기전력이 생길까요?',note:'코일 면에 수직인 균일한 자기장 B(t)=B₀sin(2πft)를 가정합니다. ε(t)=−NA·dB/dt. 부호는 렌츠 법칙을 나타냅니다.'},
{id:'capacitor',title:'축전기 충전과 방전',label:'04 · 전기 회로',summary:'저항과 축전기가 연결된 회로에서 충·방전 곡선을 비교합니다.',legend:'초록색은 축전기 전압, 주황색은 저항을 흐르는 전류의 크기입니다.',controls:[['voltage','전원 전압 (V)',1,12,1,9],['resistance','저항 (kΩ)',1,20,1,5],['capacitance','전기 용량 (μF)',10,500,10,200],['mode','충전 0 / 방전 1',0,1,1,0]],question:'저항과 전기 용량을 각각 두 배로 늘리면 충·방전 시간은 어떻게 될까요?',note:'이상적인 직류 RC 회로에서 τ=RC. 충전 Vc=V(1−e^(−t/τ)), 방전 Vc=Ve^(−t/τ). 방전은 시작할 때 완전히 충전된 상태를 가정합니다.'},
{id:'ac',title:'교류와 저항·축전기',label:'05 · 교류',summary:'저항과 축전기를 직렬 연결했을 때 주파수별 전류 크기와 위상차를 확인합니다.',legend:'파랑: 전원 전압, 주황: 전류(시각화용 정규화). 축전기가 있으면 전류가 전압보다 앞섭니다.',controls:[['v','실효 전압 (V)',1,20,1,10],['R','저항 (Ω)',10,200,10,100],['C','전기 용량 (μF)',1,100,1,20],['f','진동수 (Hz)',10,1000,10,100]],question:'진동수가 높아지면 축전기의 용량 리액턴스는 어떻게 될까요?',note:'이상적인 직렬 RC 교류 회로. Xc=1/(2πfC), |Z|=√(R²+Xc²), Irms=Vrms/|Z|. 전류 위상은 전압보다 arctan(Xc/R)만큼 빠릅니다.'},
{id:'diode',title:'다이오드의 한 방향 전류',label:'06 · 반도체',summary:'정방향·역방향 전압에 대한 다이오드의 단순화된 전류–전압 특성을 비교합니다.',legend:'그래프는 이 교육용 모형의 전류–전압 특성입니다. 점은 현재 설정한 조건을 나타냅니다.',controls:[['bias','다이오드 전압 (V)',-1,0.9,0.1,0.8],['temp','온도 (°C)',0,80,5,25]],question:'다이오드에 역방향 전압을 걸면 모든 상황에서 전류가 정확히 0일까요?',note:'Shockley 식 I=Is[exp(V/(nVt))−1]의 제한된 예시 모델(Is=1 nA, n=2). 고전압·항복·직렬저항·발열은 반영하지 않았습니다.'},
{id:'logic',title:'논리 게이트 실험',label:'07 · 논리회로',summary:'두 입력을 0 또는 1로 바꾸고 AND·OR·XOR·NAND·NOR 출력을 확인합니다.',legend:'논리 게이트는 두 입력을 정해진 규칙에 따라 처리합니다.',controls:[['A','입력 A',0,1,1,1],['B','입력 B',0,1,1,0],['gate','게이트: AND 0 / OR 1 / XOR 2 / NAND 3 / NOR 4',0,4,1,0]],question:'XOR 게이트는 두 입력이 같을 때와 다를 때 각각 무엇을 출력할까요?',note:'이상적인 디지털 논리 모형. 0과 1은 논리 수준이며 실제 전압 임계값·전파 지연은 생략합니다.'},
{id:'adder',title:'반가산기: 두 비트의 덧셈',label:'08 · 디지털',summary:'XOR와 AND 게이트가 합(S)과 자리올림(C)을 어떻게 만드는지 확인합니다.',legend:'S=A XOR B, C=A AND B. 두 입력은 각각 0 또는 1입니다.',controls:[['A','입력 A',0,1,1,1],['B','입력 B',0,1,1,1]],question:'1과 1을 더하면 합과 자리올림은 각각 어떻게 될까요?',note:'반가산기는 이전 자리에서 넘어온 자리올림 입력을 받지 않습니다. 3개 입력은 전가산기에서 처리합니다.'},
{id:'divider',title:'전압 분배 회로',label:'09 · 저항 회로',summary:'두 저항을 직렬로 잇고 어느 저항에 더 큰 전압이 걸리는지 살펴봅니다.',legend:'출력 전압은 아래쪽 저항 R₂의 양단 전압으로 정의합니다.',controls:[['Vin','전원 전압 (V)',1,24,1,12],['R1','위쪽 저항 R₁ (Ω)',10,1000,10,200],['R2','아래쪽 저항 R₂ (Ω)',10,1000,10,400]],question:'R₁과 R₂를 둘 다 2배로 하면 출력 전압은 달라질까요?',note:'이상적인 직류 전원, 출력에 부하가 없는 경우 Vout=Vin·R₂/(R₁+R₂). 부하를 연결하면 분배 비가 달라질 수 있습니다.'},
{id:'transmission',title:'왜 높은 전압으로 송전할까?',label:'10 · 전력',summary:'같은 전력을 보낼 때 송전 전압을 바꾸면 전선 손실이 어떻게 달라지는지 비교합니다.',legend:'주황색 막대는 전선에서 열로 손실되는 전력을 나타냅니다.',controls:[['power','송전 전력 (kW)',1,10,1,5],['voltage','송전 전압 (kV)',1,20,1,5],['resistance','왕복 선로 저항 (Ω)',1,20,1,5]],question:'송전 전압을 두 배로 하면 전선에서 발생하는 열 손실은 몇 배가 될까요?',note:'일정한 송전 전력 P에서 I=P/V, 선로 열 손실 Ploss=I²R인 간단한 근사입니다. 실제 계통의 변압기 손실·역률·전압 강하는 생략합니다.'},
{id:'transformer',title:'변압기 권수와 전압',label:'11 · 교류 기기',summary:'1차·2차 코일의 감은 수에 따른 전압의 변화를 확인합니다.',legend:'권수 비 N₂/N₁가 출력 교류 전압의 비를 결정합니다.',controls:[['n1','1차 감은 수',20,400,20,100],['n2','2차 감은 수',20,400,20,200],['v1','1차 실효 전압 (V)',1,24,1,12],['load','2차 저항 부하 (Ω)',10,200,10,100]],question:'2차 코일 감은 수가 절반이 되면 출력 전압은 어떻게 될까요?',note:'이상적인 변압기 근사 V₂/V₁=N₂/N₁, I₁V₁=I₂V₂. 직류를 계속 인가했을 때의 작동은 이 모형에 포함되지 않습니다.'},
{id:'lorentz',title:'움직이는 전하에 작용하는 자기력',label:'12 · 로렌츠 힘',summary:'전하량·속도·자기장·방향의 각도로 자기력의 변화를 확인합니다.',legend:'양전하에 대해 v×B 방향이 자기력 방향이며 음전하에서는 반대입니다.',controls:[['q','전하량 (μC)',-5,5,1,2],['speed','속력 (km/s)',0,20,1,10],['B','자기장 (mT)',0,100,5,50],['angle','속도와 자기장 사이 각도 (°)',0,180,15,90]],question:'전하가 자기장과 나란히 이동할 때 자기력은 얼마일까요?',note:'자기력의 크기 F=|q|vB|sinθ|. 여기서는 전기장과 다른 외력은 없다고 가정합니다.'},
{id:'motor',title:'직류 전동기와 회전 토크',label:'13 · 전동기',summary:'자기장과 코일 전류가 회전 토크를 만드는 과정을 확인합니다.',legend:'현재 회전각에서 도선에 작용하는 토크를 표시합니다. 정류자에 의한 연속 회전은 단순화했습니다.',controls:[['turns','코일 감은 수',1,100,1,40],['current','전류 (A)',0,5,0.5,2],['B','자기장 (mT)',0,200,10,100],['area','코일 면적 (cm²)',10,100,10,50],['angle','코일 법선과 자기장 각도 (°)',0,180,15,90]],question:'코일 법선 방향이 자기장과 일치하면 회전시키려는 토크는 얼마일까요?',note:'자기 쌍극자 토크 τ=N I A B sinθ. 전동기의 실제 회전 속도는 마찰·역기전력·관성의 영향도 받습니다.'},
{id:'generator',title:'회전 코일 발전기',label:'14 · 발전기',summary:'코일의 감은 수, 자기장, 회전 속도를 바꿔 유도 전압의 크기를 비교합니다.',legend:'회전하는 코일이 만드는 이상적인 정현파 유도 기전력을 표시합니다.',controls:[['turns','코일 감은 수',10,200,10,100],['B','자기장 (mT)',10,200,10,100],['area','코일 면적 (cm²)',10,100,10,50],['rpm','회전 속도 (rpm)',0,1200,60,600]],question:'회전 속도를 2배로 하면 최대 유도 전압은 어떻게 될까요?',note:'균일 자기장·일정 각속도·한 개 코일의 이상화 모형 εmax=N B A ω, ω=2π·rpm/60입니다.'},
{id:'rlc',title:'RLC 회로의 공진',label:'15 · 공진',summary:'저항·코일·축전기의 값을 바꿔 주파수에 따른 전류의 크기를 관찰합니다.',legend:'회로가 직렬일 때 공진 주파수에서 리액턴스가 상쇄되어 전류가 최대가 됩니다.',controls:[['R','저항 (Ω)',5,200,5,40],['L','인덕턴스 (mH)',10,200,10,100],['C','전기 용량 (μF)',1,100,1,10],['f','교류 진동수 (Hz)',10,1000,10,150],['V','전원 실효 전압 (V)',1,20,1,10]],question:'저항이 커지면 공진점에서 전류의 최대값은 어떻게 달라질까요?',note:'이상적인 직렬 RLC에서 |Z|=√[R²+(ωL−1/ωC)²], Irms=Vrms/|Z|, f₀=1/(2π√LC).'}
,
{id:'bridge',title:'휘트스톤 브리지',label:'16 · 저항 측정',summary:'네 저항의 비를 바꾸며 중앙 두 점의 전위차가 0이 되는 평형 조건을 찾습니다.',legend:'왼쪽 가지는 R₁·R₂, 오른쪽 가지는 R₃·R₄ 직렬 연결입니다.',controls:[['V','전원 전압 (V)',1,20,1,10],['r1','왼쪽 위 R₁ (Ω)',10,100,10,20],['r2','왼쪽 아래 R₂ (Ω)',10,100,10,40],['r3','오른쪽 위 R₃ (Ω)',10,100,10,30],['r4','오른쪽 아래 R₄ (Ω)',10,100,10,60]],question:'평형이 이루어질 때 R₁/R₂와 R₃/R₄는 어떤 관계인가요?',note:'중앙 연결에 전류가 흐르지 않는 전압계(무한 입력저항)를 가정합니다. 각 분압 점의 차이를 계산합니다.'},
{id:'rectifier',title:'정류 회로',label:'17 · 정류',summary:'교류의 음수 반주기를 막거나 뒤집어 반파·전파 정류 파형을 비교합니다.',legend:'입력 파란색, 정류 후 주황색. 전파 모드에서는 다이오드 브리지를 이상화합니다.',controls:[['amplitude','전원 최대 전압 (V)',1,20,1,10],['freq','주파수 (Hz)',10,100,10,50],['mode','방식: 반파 0 / 전파 1',0,1,1,1]],question:'반파와 전파 정류 후 출력 파형의 음수 부분은 어떻게 달라질까요?',note:'이상적인 다이오드(전압 강하 0V), 평활 커패시터 없음. 정류 출력은 매끈한 직류가 아니라 맥류입니다.'},
{id:'led',title:'LED 밝기와 저항',label:'18 · LED',summary:'전원 전압과 직렬 저항을 조절하며 LED를 안전하게 작동시키는 전류를 계산합니다.',legend:'이상화한 LED의 순방향 전압을 2.0V로 고정합니다. 전류가 높아질수록 밝기가 증가한다고 단순화합니다.',controls:[['Vin','전원 전압 (V)',0,12,0.5,5],['R','직렬 저항 (Ω)',50,1000,50,330]],question:'LED와 직렬 저항을 연결하지 않고 높은 전압을 가하면 왜 위험할까요?',note:'LED의 순방향 전압 2V 일정 가정. I=max(0,(Vin−2V)/R). 20mA를 초과하면 과전류 경고를 표시합니다. 실제 LED에는 정격과 열특성이 있습니다.'},
{id:'electroscope',title:'금속박 검전기',label:'19 · 정전기',summary:'검전기의 전하량과 외부 물체의 대전 상태를 바꾸며 금속박 벌어짐을 관찰합니다.',legend:'금속박 두 장이 같은 부호로 대전되면 서로 밀어냅니다. 그림은 정성적 모형입니다.',controls:[['charge','검전기 순전하 (상대값)',-5,5,1,2],['external','가까운 물체 전하 (상대값)',-5,5,1,0],['distance','물체와 손잡이 거리 (cm)',1,20,1,10]],question:'검전기 자체가 중성이어도 가까운 대전체 때문에 금속박이 벌어질 수 있을까요?',note:'정전기 유도로 인한 정성적 시각화입니다. 금속박 각도는 실제 정량 예측이 아니며 전하의 재배치와 중력·기하 형태에 따라 달라집니다.'},
{id:'magnet',title:'막대자석과 나침반',label:'20 · 막대자석',summary:'막대자석의 세기와 나침반 위치를 바꿔 자기장의 방향을 살펴봅니다.',legend:'막대자석의 장은 먼 거리에서 자기 쌍극자장으로 근사합니다. 바늘은 국소 자기장 방향을 따릅니다.',controls:[['strength','자기 모멘트 (상대값)',1,10,1,5],['x','나침반 가로 위치',-200,200,20,140],['y','나침반 세로 위치',-140,140,20,-60]],question:'자석의 N극 앞과 옆에서는 나침반 N극이 각각 어느 쪽을 가리킬까요?',note:'점자기쌍극자 2차원 단면의 방향을 그린 모형입니다. 자석 가까운 곳에서는 실제 막대자석의 자기장과 차이가 큽니다.'},
{id:'electromagnet',title:'코일 전자석',label:'21 · 전자석',summary:'코일 감은 수와 전류의 방향·세기를 바꾸면 내부 자기장이 달라집니다.',legend:'솔레노이드의 내부 자기장은 일정하다고 근사합니다. 전류의 부호는 자기장 방향을 바꿉니다.',controls:[['turns','코일 감은 수 N',10,300,10,100],['length','코일 길이 (cm)',5,30,1,15],['current','전류 (A)',-5,5,0.5,2]],question:'코일 감은 수를 2배로 하고 길이는 그대로 두면 중심의 자기장은 어떻게 될까요?',note:'충분히 긴 공심 솔레노이드의 근사 B=μ₀(N/ℓ)I입니다. 끝부분 자기장·철심의 자화·포화는 반영하지 않습니다.'},
{id:'friction',title:'마찰전기와 전하 이동',label:'22 · 마찰전기',summary:'두 물체 사이의 전자 이동량을 바꿔 전하량 보존을 확인합니다.',legend:'한 물체가 전자를 잃으면 양전하, 얻으면 음전하를 띱니다.',controls:[['transfer','A에서 B로 이동한 전자 수 (상대값)',-8,8,1,4]],question:'마찰한 두 물체의 전체 전하량은 변할까요?',note:'전자 한 개의 전하는 −e입니다. 마찰로 전하가 생성되는 것이 아니라 이동합니다. 재질별 전자 이동 방향은 실제 표면 상태 등에 좌우됩니다.'},
{id:'spectrum',title:'전자기파의 파장과 진동수',label:'23 · 전자기파',summary:'진동수를 바꾸며 전자기파의 파장과 광자 에너지 사이의 관계를 확인합니다.',legend:'빛의 속력 c≈3.00×10⁸m/s (진공). 파장은 λ=c/f입니다.',controls:[['logf','진동수의 지수: 10ⁿ Hz',6,20,1,14]],question:'진동수가 10배 높아지면 파장과 광자 에너지는 각각 어떻게 변할까요?',note:'진공 전자기파 λ=c/f, E=hf. 가시광선 영역은 약 400~700nm이며 파장·범위 경계는 분류 방식에 따라 약간 달라집니다.'},
{id:'amfm',title:'AM과 FM 변조',label:'24 · 전파 통신',summary:'신호의 세기와 변조 방식을 바꿔 정보가 반송파에 실리는 모습을 관찰합니다.',legend:'AM은 반송파 진폭을, FM은 반송파의 순간 진동수를 변화시킵니다.',controls:[['mode','AM 0 / FM 1',0,1,1,0],['depth','변조 깊이 (상대값)',0,1,0.1,0.5],['signal','정보 신호 진동수 (상대값)',1,4,1,2]],question:'AM에서는 진폭과 진동수 중 어떤 특성이 정보를 나타낼까요?',note:'정규화된 교육용 파형입니다. AM=(1+m sinωmt)sinωct, FM=sin[ωct+β sinωmt]. 실제 주파수 수치는 축약했습니다.'},
{id:'touch',title:'정전식 터치의 원리',label:'25 · 센서',summary:'손가락과 전극의 거리·면적을 바꾸며 정전 용량의 변화를 관찰합니다.',legend:'전극 사이의 평행판 축전기 근사를 사용합니다. 손가락은 실제로 복잡한 주변 전기장에 영향을 줍니다.',controls:[['area','겹치는 면적 (cm²)',1,30,1,10],['distance','거리 (mm)',1,10,1,3],['relative','유전율 비 εr',1,10,1,3]],question:'접촉 면적이 커지면 정전 용량은 어떻게 달라질까요?',note:'평행판 축전기 C=ε₀εr A/d의 이상적 비교 모형입니다. 실제 정전식 터치스크린 센서의 구조·프린지 필드는 생략합니다.'},
{id:'seven',title:'7세그먼트 숫자 만들기',label:'26 · 디스플레이',summary:'숫자를 0~9로 바꾸면 어떤 LED 세그먼트가 켜지는지 확인합니다.',legend:'a~g의 7개 막대가 숫자를 표시하는 기본 표시 모형입니다.',controls:[['digit','표시할 숫자',0,9,1,8]],question:'숫자 8은 왜 7개 세그먼트가 모두 켜져야 할까요?',note:'표준적인 7세그먼트 숫자 모양의 한 예입니다. 실제 구동 회로의 전류제한 저항과 핀 배열은 포함되지 않습니다.'},
{id:'halfwave',title:'교류 발전기와 파형',label:'27 · 교류와 직류',summary:'회전 속도와 최대 전압을 조절해 시간에 따라 극성이 변하는 교류를 관찰합니다.',legend:'직류는 일정 전압, 교류는 사인파 전압을 기준으로 비교합니다.',controls:[['amplitude','최대 전압 (V)',1,20,1,10],['freq','진동수 (Hz)',0,120,10,60],['mode','직류 0 / 교류 1',0,1,1,1]],question:'교류는 한 주기 동안 전압의 부호가 몇 번 바뀔까요?',note:'이상적인 직류 또는 정현파 교류 V(t)=Vmax sin(2πft). f=0일 때 파형은 0으로 표시합니다.'}
,
{id:'dielectric',title:'축전기와 유전체',label:'28 · 유전체',summary:'두 평행판 사이에 끼운 물질의 상대유전율이 전기 용량을 얼마나 변화시키는지 확인합니다.',legend:'유전체는 판 사이의 전기장을 변화시켜 같은 전압에서 더 많은 전하를 저장하도록 합니다.',controls:[['area','판 면적 (cm²)',10,100,10,50],['gap','판 사이 거리 (mm)',1,10,1,3],['eps','상대 유전율',1,10,1,4],['voltage','걸어준 전압 (V)',1,20,1,9]],question:'전원을 연결한 채 유전체를 삽입하면 저장 전하량은 어떻게 달라질까요?',note:'평행판의 가장자리 효과는 무시하며 C=ε₀εrA/d, Q=CV, U=½CV². 전압을 일정하게 유지하는 경우입니다.'},
{id:'wireloop',title:'원형 도선 중심의 자기장',label:'29 · 원형 도선',summary:'원형 도선의 반지름과 전류에 따른 중심 자기장을 계산합니다.',legend:'원형 루프 중심에서 B=μ₀NI/(2R), 전류 방향에 따라 자기장 방향도 바뀝니다.',controls:[['turns','감은 수 N',1,100,1,10],['I','전류 (A)',-10,10,1,5],['radius','루프 반지름 (cm)',2,25,1,10]],question:'도선 반지름이 두 배가 되면 같은 전류에서 중심 자기장은 몇 배가 될까요?',note:'원형 도선의 중심점·진공에서의 근사. 코일 중심을 벗어난 자기장은 다르게 계산합니다.'},
{id:'bulb',title:'백열전구의 전력과 열',label:'30 · 백열전구',summary:'같은 저항으로 단순화한 전구에서 전압을 높일수록 소비 전력이 어떻게 증가하는지 확인합니다.',legend:'밝기 표현은 전력의 시각적 비유입니다. 실제 필라멘트의 저항은 온도에 따라 변합니다.',controls:[['voltage','전압 (V)',0,12,1,6],['R','저항 (Ω)',2,40,2,12]],question:'저항이 일정하면 전압을 두 배로 올릴 때 소비 전력은 몇 배가 될까요?',note:'저항 일정 근사 P=V²/R. 실제 백열전구는 온도에 따라 R이 변하므로 정격 이상 작동을 예측하면 안 됩니다.'},
{id:'conduct',title:'도체의 저항과 전류',label:'31 · 전도',summary:'물질의 비저항·길이·단면적에 따라 도선 저항이 어떻게 달라지는지 관찰합니다.',legend:'저항의 크기는 도선 길이에 비례하고 단면적에 반비례합니다.',controls:[['rho','비저항 (×10⁻⁸ Ω·m)',1,100,1,2],['length','도선 길이 (m)',1,20,1,5],['area','단면적 (mm²)',1,20,1,5],['voltage','전압 (V)',1,12,1,3]],question:'같은 재료의 도선 길이를 두 배로 하고 굵기는 그대로 두면 저항은 몇 배가 될까요?',note:'균일한 온도·단면의 도체에서 R=ρℓ/A. 물질의 온도 의존성과 전원 내부 저항은 생략합니다. 저항이 작은 도선에 전지를 직접 연결하는 실험은 위험합니다.'},
{id:'stairs',title:'계단의 두 곳에서 켜는 스위치',label:'32 · 배선',summary:'양쪽의 선택 스위치를 각각 바꾸면 하나의 전등이 켜지고 꺼지는 원리를 확인합니다.',legend:'두 개의 SPDT 선택 스위치가 두 가닥의 연결선 중 하나를 선택합니다.',controls:[['s1','아래층 스위치 위치',0,1,1,0],['s2','위층 스위치 위치',0,1,1,0]],question:'한쪽 스위치만 바꾸면 전등 상태는 언제나 반대로 바뀔까요?',note:'두 스위치가 같은 연결선을 선택하면 도통되는 기본 2곳 제어 회로 모형입니다. 실제 교류 배선 작업은 자격을 갖춘 전문가가 수행해야 합니다.'},
{id:'touchr',title:'감압식 터치스크린',label:'33 · 감압식 센서',summary:'손가락을 누른 위치에 따라 위아래 저항막에서 측정하는 전압 분배가 달라집니다.',legend:'한 축을 구동해 위치에 비례한 전압을 읽는 저항막 방식입니다.',controls:[['x','터치 가로 위치 (%)',0,100,5,35],['y','터치 세로 위치 (%)',0,100,5,60],['voltage','구동 전압 (V)',1,5,1,5]],question:'가운데를 누르면 위치 전압은 전체 전압의 몇 퍼센트가 될까요?',note:'균일 저항막·접촉저항 무시의 교육용 위치 판독 모형. 실제 장치는 두 축을 번갈아 구동합니다.'},
{id:'transistor',title:'트랜지스터로 LED 켜기',label:'34 · 트랜지스터',summary:'베이스 전류가 컬렉터의 더 큰 전류를 제어하는 단순화된 스위칭 동작을 확인합니다.',legend:'NPN BJT를 간단한 전류 제어 스위치로 모델링합니다.',controls:[['ib','베이스 전류 (mA)',0,2,0.1,0.5],['beta','전류 증폭률 β',20,200,10,100],['limit','부하 제한 전류 (mA)',10,100,10,40]],question:'베이스 전류를 계속 올려도 컬렉터 전류가 무한히 커질까요?',note:'Ic≈min(βIb, 부하 제한 전류)라는 단순화입니다. 실제 스위칭의 Vbe·Vce(sat)·온도와 소자 정격은 생략합니다.'},
{id:'lc',title:'LC 진동 회로',label:'35 · LC 진동',summary:'축전기의 전기 에너지와 코일의 자기 에너지가 번갈아 저장되는 과정을 확인합니다.',legend:'저항이 없는 이상적인 LC 회로에서 전체 에너지는 일정합니다.',controls:[['L','인덕턴스 (mH)',10,200,10,100],['C','정전 용량 (μF)',1,100,1,20],['voltage','초기 축전기 전압 (V)',1,12,1,9]],question:'시간에 따라 축전기의 에너지가 줄어들면 코일의 에너지는 어떻게 될까요?',note:'이상적인 손실 없는 LC 회로. q(t)=Q₀cos(ωt), i(t)=−ωQ₀sin(ωt), ω=1/√LC. 현실에서는 저항 때문에 감쇠합니다.'},
{id:'rl',title:'인덕터에 흐르는 전류',label:'36 · RL 회로',summary:'전원을 연결한 직후 코일이 전류의 빠른 변화를 방해하는 모습을 그래프로 확인합니다.',legend:'직렬 RL 회로의 전류는 처음 0에서 서서히 최종값에 가까워집니다.',controls:[['L','인덕턴스 (mH)',10,500,10,200],['R','저항 (Ω)',1,100,1,20],['voltage','전원 전압 (V)',1,12,1,6]],question:'인덕턴스를 두 배로 하면 같은 저항에서 정상상태 도달 시간은 어떻게 달라질까요?',note:'직렬 RL의 시간 상수 τ=L/R, 전류 i(t)=V/R[1−exp(−t/τ)]. 코일 내부저항과 자기 포화는 무시합니다.'},
{id:'magnetize',title:'강자성체의 자화',label:'37 · 자화',summary:'외부 자기장에 따라 여러 자기 구역의 방향이 정렬되는 정성적 모형입니다.',legend:'자기 구역의 화살표가 외부 자기장과 같은 방향으로 정렬되는 정도를 보여줍니다.',controls:[['field','외부 자기장 (상대값)',-10,10,1,5],['coercive','자화 저항 정도 (상대값)',1,10,1,4]],question:'외부 자기장을 제거하면 모든 강자성체의 자화가 완전히 사라질까요?',note:'자기 구역을 정성적으로 나타낸 교육용 모형이며 실제 히스테리시스 곡선·잔류자화·보자력 수치는 계산하지 않습니다.'},
{id:'ammeter',title:'전류계 연결 방법',label:'38 · 측정 기기',summary:'전류계를 직렬로 연결해야 회로 전체 전류를 읽을 수 있다는 원리를 확인합니다.',legend:'전류계에는 내부 저항이 있으며, 병렬 연결은 위험할 수 있습니다.',controls:[['voltage','전원 전압 (V)',1,12,1,6],['load','부하 저항 (Ω)',5,100,5,30],['meter','전류계 내부 저항 (Ω)',0.1,2,0.1,0.5]],question:'전류계 내부 저항이 작아야 하는 이유는 무엇일까요?',note:'직렬 연결에서 I=V/(Rload+Rmeter). 실제 전류계를 전원 양단에 바로 연결하면 기기가 손상될 수 있으므로 금지합니다.'},
{id:'oscilloscope',title:'마이크와 스피커의 에너지 전환',label:'39 · 소리와 전기',summary:'소리의 진동을 전기 신호로 바꾸고 다시 스피커의 진동으로 재생하는 과정을 확인합니다.',legend:'입력 음압과 전기 신호, 출력 진동의 파형이 같은 주기임을 보여줍니다.',controls:[['freq','소리 진동수 (Hz)',100,1000,50,400],['amplitude','소리 진폭 (상대값)',0,10,1,6],['gain','증폭도 (배)',1,5,1,2]],question:'입력 소리의 진동수를 높이면 스피커 진동의 진동수도 높아질까요?',note:'마이크·증폭기·스피커의 선형 변환을 묘사한 개념 모형. 실제 변환 효율·공진·왜곡은 포함하지 않습니다.'},
{id:'emwave',title:'진동하는 전하와 전자기파',label:'40 · 파동 방출',summary:'진동하는 전하가 시간에 따라 변하는 전기장과 자기장을 만드는 개념을 살펴봅니다.',legend:'파동은 진공에서 빛의 속력으로 전파되며 E와 B가 서로 수직입니다.',controls:[['frequency','진동수 (MHz)',100,1000,100,300],['amplitude','전기장 진폭 (상대값)',1,10,1,5]],question:'진동수가 높아지면 진공에서 전자기파의 파장은 어떻게 달라질까요?',note:'평면파 원거리장 개념도입니다. E/B=c 관계와 λ=c/f를 사용하며, 실제 진동 전하 근접장의 복잡한 구조는 생략합니다.'},
{id:'beam',title:'음극선관 전자빔 편향',label:'41 · 전자빔',summary:'전자빔이 전기장 안에서 휘어지는 방향과 크기를 관찰합니다.',legend:'전자 전하는 음수이므로 전기장 방향과 반대로 힘을 받습니다.',controls:[['voltage','가속 전압 (V)',100,2000,100,800],['field','편향 전기장 (kV/m)',-10,10,1,5],['length','편향판 길이 (cm)',1,20,1,8]],question:'가속 전압을 높여 전자 속도를 키우면 같은 전기장에서 휘어짐은 어떻게 될까요?',note:'비상대론적 전자, 균일한 횡전기장, 작은 각도 근사. 자기 편향과 CRT 고전압 위험성은 별도입니다.'},
{id:'solar',title:'태양풍과 자기권',label:'42 · 지구 자기권',summary:'태양풍이 지구 자기권에 영향을 주는 개념 그림을 관찰합니다.',legend:'자기권의 태양 쪽 압축과 반대쪽 꼬리 구조를 개념적으로 표현합니다.',controls:[['wind','태양풍 동압 (상대값)',1,10,1,5],['field','지구 자기장 세기 (상대값)',1,10,1,5]],question:'태양풍 압력이 강해질 때 지구의 낮 쪽 자기권 경계는 일반적으로 어떻게 변할까요?',note:'실제 자기권은 자기유체역학적 상호작용으로 결정되며, 이 도형 크기는 정성적인 예시입니다. 오로라는 하전입자와 대기 입자의 상호작용으로 빛납니다.'}
,
{id:'potential',title:'점전하 주변의 전위',label:'43 · 전기적 위치 에너지',summary:'전하량과 거리를 바꾸면 한 점의 전위가 어떻게 변하는지 관찰합니다.',legend:'전위의 부호는 기준을 무한대에서 0V로 두었을 때 전하의 부호와 같습니다.',controls:[['q','중심 전하 (nC)',-10,10,1,5],['r','관찰 거리 (cm)',5,50,5,20]],question:'전하의 양은 같고 거리만 두 배가 되면 전위는 몇 배가 될까요?',note:'진공 속 점전하의 전위 V=kq/r, 전기장 크기 E=k|q|/r². 무한히 멀리에서 V=0으로 정했습니다.'},
{id:'buckboost',title:'DC–DC 컨버터의 원리',label:'44 · 전력 전자',summary:'스위칭 듀티비에 따라 강압·승압 컨버터의 이상적인 전압 비율을 비교합니다.',legend:'벅은 전압을 낮추고, 부스트는 전압을 높입니다. 전력을 새로 만들어 내지는 않습니다.',controls:[['vin','입력 전압 (V)',1,24,1,12],['duty','듀티비 (%)',10,90,5,50],['mode','벅 0 / 부스트 1',0,1,1,0],['load','출력 저항 (Ω)',10,200,10,100]],question:'승압하면 전압은 커지는데 입력·출력 에너지는 어떻게 보존될까요?',note:'연속전도 모드의 이상적인 기본 근사. 벅 Vout=DVin, 부스트 Vout=Vin/(1−D), 효율 100% 가정. 실제 손실·제어·전류 한계는 생략합니다.'},
{id:'homopolar',title:'호모폴라 전동기의 힘',label:'45 · 호모폴라',summary:'자기장 안의 전류가 흐르는 도선이 받는 힘을 비교합니다.',legend:'도선과 자기장이 수직인 구간에서 F=ILB입니다. 회전 방향은 전류와 자기장 방향이 결정합니다.',controls:[['I','전류 (A)',-5,5,0.5,2],['B','자기장 (mT)',-200,200,10,100],['length','작용 도선 길이 (cm)',1,15,1,8],['radius','회전 반지름 (cm)',1,10,1,5]],question:'전지의 극을 반대로 바꾸면 회전 방향은 어떻게 될까요?',note:'균일한 자기장 안에서 수직인 직선 도선의 자기력과 토크 근사. 실제 호모폴라 전동기 형상에 따라 힘이 분포하고 마찰이 있습니다.'},
{id:'bands',title:'금속과 반도체의 에너지 띠',label:'46 · 에너지 띠',summary:'가전자띠와 전도띠 사이의 간격에 따라 전자가 들뜨기 위한 에너지를 비교합니다.',legend:'밴드갭이 0에 가까우면 전도성 거동이 쉬워집니다. 실제 금속·반도체는 밴드 점유까지 고려해야 합니다.',controls:[['gap','밴드갭 (eV)',0,4,0.2,1.2],['photon','광자 에너지 (eV)',0,5,0.2,2]],question:'입사하는 광자의 에너지가 밴드갭보다 작으면 띠 사이 전이는 가능할까요?',note:'광자 하나에 의한 띠 사이 전이의 에너지 조건 E≥Eg를 나타내는 간략 모형입니다. 선택 규칙·운동량·불순물 상태는 생략합니다.'},
{id:'surface',title:'도체 표면의 전하 분포',label:'47 · 전하 분포',summary:'끝이 뾰족한 도체와 둥근 도체에서 표면 전하 밀도가 달라지는 이유를 탐구합니다.',legend:'뾰족한 부분에서는 정전평형에서 국소 전기장이 상대적으로 강해질 수 있습니다.',controls:[['shape','모양: 둥근 0 / 뾰족 1',0,1,1,1],['charge','전체 전하량 (상대값)',-10,10,1,5]],question:'같은 전하량이라도 뾰족한 도체 끝에서 방전이 더 쉽게 일어날 수 있는 이유는 무엇일까요?',note:'정전평형과 곡률 효과를 설명하는 정성적 그림입니다. 정확한 표면 전하 밀도는 도체의 전체 형상과 주변 물체에 따라 달라집니다.'},
{id:'sorting',title:'자석으로 금속 분리하기',label:'48 · 물질과 자기',summary:'철과 알루미늄이 자석에 다르게 반응하는 성질을 비교합니다.',legend:'철은 강자성체이며 알루미늄은 약한 상자성체로, 정지한 일반 조건의 영구자석으로는 보통 철만 쉽게 끌립니다.',controls:[['field','자석 세기 (상대값)',0,10,1,5],['metal','대상 물질: 철 0 / 알루미늄 1',0,1,1,0]],question:'알루미늄이 자석에 잘 붙지 않는다고 자기장에 전혀 반응하지 않는다고 할 수 있을까요?',note:'정성적 비교. 알루미늄의 매우 약한 상자성과 이동하는 금속에서의 와전류 효과는 별개입니다. 실제 분리성능은 거리와 형상에도 좌우됩니다.'},
{id:'water',title:'물 분자가 직선형이라면?',label:'49 · 분자 극성',summary:'물 분자의 결합각을 바꾸며 두 O–H 결합 쌍극자의 합성 방향을 비교합니다.',legend:'실제 H₂O는 약 104.5°의 굽은 구조를 가지며, 결합이 완전히 대칭인 직선 구조라면 쌍극자 모멘트는 상쇄됩니다.',controls:[['angle','H–O–H 결합각 (°)',90,180,5,105],['dipole','결합 쌍극자 크기 (상대값)',1,10,1,5]],question:'두 O–H 결합이 180°로 일직선이면 물 분자의 전체 극성은 어떻게 될까요?',note:'두 동일한 결합 쌍극자의 벡터합 2p cos(θ/2)를 이용한 개념 모형입니다. 실제 물 분자 각도는 약 104.5°입니다.'},
{id:'chargeshare',title:'전하량 보존과 도체 접촉',label:'50 · 접촉 대전',summary:'전하를 띤 두 동일한 금속 구가 접촉한 뒤 분리되면 전하가 어떻게 나뉘는지 확인합니다.',legend:'크기와 형상이 같은 멀리 떨어진 도체 구 두 개는 접촉 후 같은 전하량으로 분배됩니다.',controls:[['a','첫째 금속 구 전하 (nC)',-10,10,1,8],['b','둘째 금속 구 전하 (nC)',-10,10,1,-2],['touch','접촉 0 / 접촉 후 분리 1',0,1,1,0]],question:'양전하 +8nC와 음전하 −2nC의 구를 접촉시키면 각각 몇 nC가 될까요?',note:'크기와 재질이 같은 두 구, 접촉 후 충분히 멀리 떨어뜨려 관찰하는 이상적 조건입니다. 전체 전하량은 언제나 보존됩니다.'}

{id:'fieldlines',title:'두 전하가 만드는 전기력선',label:'51 · 전기력선',summary:'두 점전하의 부호와 세기를 바꾸고 공간에 펼쳐지는 전기장의 방향을 관찰합니다.',legend:'전기력선은 양전하에서 나와 음전하로 들어갑니다. 선의 접선 방향이 양의 시험전하가 받는 힘의 방향입니다.',controls:[['q1','왼쪽 전하 (상대값)',-3,3,1,2],['q2','오른쪽 전하 (상대값)',-3,3,1,-2],['distance','전하 사이 거리 (상대값)',2,6,1,4]],question:'전기력선이 서로 교차할 수 있을까요? 그 이유는 무엇일까요?',note:'두 점전하의 쿨롱 전기장 벡터를 중첩한 방향장입니다. 실제 전기력선은 시각화 개념이며 입자의 이동 궤적과는 다릅니다.'},

let active=0,vals={},history=[];function line(x1,y1,x2,y2,c='#437c86',w=2){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke()}}function text(t,x,y,size=16,color='#20384b',align='center'){g.fillStyle=color;g.font='600 '+size+'px system-ui';g.textAlign=align;g.fillText(t,x,y)}function arrow(x1,y1,x2,y2,c='#e77757',w=4){line(x1,y1,x2,y2,c,w);let a=Math.atan2(y2-y1,x2-x1);line(x2,y2,x2-14*Math.cos(a-.5),y2-14*Math.sin(a-.5),c,w);line(x2,y2,x2-14*Math.cos(a+.5),y2-14*Math.sin(a+.5),c,w)}function grid(){g.clearRect(0,0,W,H);g.fillStyle='#f8fbfc';g.fillRect(0,0,W,H);g.strokeStyle='#e5eff1';g.lineWidth=1;for(let x=40;x<W;x+=40)line(x,30,x,H-30,'#e9f0f2',1);for(let y=30;y<H;y+=40)line(40,y,W-40,y,'#e9f0f2',1)}function fmt(v,d=2){return Number.isFinite(v)?v.toFixed(d):'—'}

function water(){let {angle,dipole}=vals,a=angle*PI/360,len=150,x1=380+len*Math.sin(a),x2=380-len*Math.sin(a),y=200+len*Math.cos(a);circle(380,200,47,'#e68174');circle(x1,y,29,'#9acbdf');circle(x2,y,29,'#9acbdf');line(380,200,x1,y,'#b9cbd2',13);line(380,200,x2,y,'#b9cbd2',13);text('O',380,211,27,'white');text('H',x1,y+8,22);text('H',x2,y+8,22);text('결합각 '+angle+'°',380,395,23);return [['합성 쌍극자 크기',fmt(2*dipole*Math.cos(angle*PI/360),3)+' (상대값)'],['분자 극성',angle===180?'이상적으로 상쇄':'극성 존재']]}
function chargeshare(){let {a,b,touch}=vals,x=touch?(a+b)/2:a,y=touch?(a+b)/2:b;circle(245,215,77,a>0?'#f3a890':'#9ccae0');circle(520,215,77,b>0?'#f3a890':'#9ccae0');text((x>=0?'+':'')+x+'nC',245,225,25);text((y>=0?'+':'')+y+'nC',520,225,25);text(touch?'접촉 후 두 동일 구':'접촉 전',380,100,22);return [['첫째 전하',fmt(x,1)+' nC'],['둘째 전하',fmt(y,1)+' nC'],['전체 전하',fmt(a+b,1)+' nC']]}


function fieldlines(){let {q1,q2,distance}=vals,x1=380-distance*43,x2=380+distance*43;function vec(x,y){let sx=0,sy=0;for(let [cx,q] of [[x1,q1],[x2,q2]]){let dx=x-cx,dy=y-215,r2=dx*dx+dy*dy+200,r3=Math.pow(r2,1.5);sx+=q*dx/r3;sy+=q*dy/r3}return [sx,sy]}for(let [cx,q] of [[x1,q1],[x2,q2]]){if(!q)continue;let dir=q>0?1:-1,n=Math.abs(q)*12;for(let j=0;j<n;j++){let a=2*PI*j/n,x=cx+21*Math.cos(a),y=215+21*Math.sin(a);g.beginPath();g.moveTo(x,y);for(let i=0;i<140;i++){let [vx,vy]=vec(x,y),norm=Math.hypot(vx,vy);if(norm<1e-12)break;x+=dir*vx/norm*3.5;y+=dir*vy/norm*3.5;if(x<20||x>740||y<20||y>410)break;g.lineTo(x,y)}g.strokeStyle='#68a7ac';g.lineWidth=1.5;g.stroke()}}circle(x1,215,23,q1>0?'#efa794':q1<0?'#9dcce0':'#d7e1e5');circle(x2,215,23,q2>0?'#efa794':q2<0?'#9dcce0':'#d7e1e5');text(q1>0?'+':q1<0?'−':'0',x1,224,26);text(q2>0?'+':q2<0?'−':'0',x2,224,26);return [['전체 상대 전하',String(q1+q2)],['전기장 계산','쿨롱 중첩'],['간격',distance+' (상대값)']]}
function lcfilter(){let {L,C,R,f,V}=vals,l=L*.001,c=C*1e-6;function gain(freq){let w=2*PI*freq,yr=1/R,yi=w*c,den=yr*yr+yi*yi,zr=yr/den,zi=-yi/den;return Math.hypot(zr,zi)/Math.hypot(zr,zi+w*l)}let ratio=gain(f),f0=1/(2*PI*Math.sqrt(l*c)),maxf=Math.max(f0*4,f*1.3,1000);axes(60,350,630,255,'주파수','전압 비율');plot(t=>Math.min(.94,gain(10+(maxf-10)*t)/2),60,350,630,250,'#1c8e86',4);text('출력 전압 / 입력 전압',380,82,21);return [['출력 실효 전압',fmt(ratio*V,3)+' V'],['전압 전달 비율',fmt(ratio,3)+' 배'],['고유 공진 진동수',fmt(f0,2)+' Hz']]}

const renderers={charge,field,induction,capacitor,ac,diode,logic,adder,divider,transmission,transformer,lorentz,motor,generator,rlc,bridge,rectifier,led,electroscope,magnet,electromagnet,friction,spectrum,amfm,touch,seven,halfwave,dielectric,wireloop,bulb,conduct,stairs,touchr,transistor,lc,rl,magnetize,ammeter,oscilloscope,emwave,beam,solar,potential,buckboost,homopolar,bands,surface,sorting,water,chargeshare,fieldlines,lcfilter};function render(){let e=experiments[active];grid();let m=renderers[e.id]();$('#metrics').innerHTML=m.map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')}
function select(i){active=i;let e=experiments[i];vals=Object.fromEntries(e.controls.map(c=>[c[0],c[5]]));$('#badge').textContent='RAON / '+e.label;$('#title').textContent=e.title;$('#summary').textContent=e.summary;$('#legend').textContent=e.legend;$('#question').textContent='생각해 보기 · '+e.question;$('#note').textContent=e.note;$('#controls').replaceChildren();e.controls.forEach(([key,label,min,max,step,value])=>{let div=document.createElement('div');div.className='control';let lab=document.createElement('label');let name=document.createElement('span');name.textContent=label;let out=document.createElement('output');out.textContent=value;lab.append(name,out);let input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=value;input.setAttribute('aria-label',label);input.oninput=()=>{vals[key]=Number(input.value);out.textContent=input.value;render()};div.append(lab,input);$('#controls').append(div)});$('#tabs').querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-selected',i===j)});history=[];$('#records').textContent='';render()}
experiments.forEach((e,i)=>{let b=document.createElement('button');b.textContent=(i+1)+'. '+e.title;b.setAttribute('role','tab');b.onclick=()=>select(i);$('#tabs').append(b)});$('#tabs').setAttribute('role','tablist');$('#record').onclick=()=>{let e=experiments[active];history.unshift(e.title+' | '+Object.entries(vals).map(([k,v])=>k+'='+v).join(', '));history=history.slice(0,8);$('#records').replaceChildren(...history.map(x=>{let p=document.createElement('p');p.textContent='• '+x;return p}))};const relatedTopics=["divider","magnet","lorentz","electromagnet","induction","electromagnet","induction","capacitor","logic","divider","oscilloscope","dielectric","touch","divider","diode","amfm","rl","divider","electroscope","wireloop","divider","rlc","capacitor","halfwave","water","surface","magnet","electroscope","electromagnet","solar","buckboost","capacitor","magnetize","magnet","divider","field","stairs","bulb","capacitor","capacitor","conduct","friction","rlc","transmission","touchr","transistor","led","motor","homopolar","transformer","divider","lcfilter","divider","electroscope","potential","potential","bridge","seven","amfm","stairs","sorting","rl","spectrum","beam","generator","adder","motor","lorentz","fieldlines","ammeter","rectifier","chargeshare","surface","electroscope","field","lc","transistor","bands","lc","lc","magnetize","emwave","diode"];const query=new URLSearchParams(location.search);const topicNumber=Number(query.get('topic'));if(query.has('topic')&&topicNumber>=1&&topicNumber<=relatedTopics.length){let idx=experiments.findIndex(e=>e.id===relatedTopics[topicNumber-1]);select(Math.max(0,idx));fetch('../electricity/catalog.json').then(r=>r.json()).then(items=>{let x=items[topicNumber-1];if(x){let el=$('#topicRef');el.hidden=false;el.textContent='연계 탐구 주제: '+x.name+' · 이 화면은 관련 과학 원리를 다루는 라온 자체 모형입니다. 원본 페이지와 동일한 실험이라는 뜻은 아닙니다.'}}).catch(()=>{});}else select(0);
</script></body></html>
