<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전기·전자 탐구 스튜디오 | RAON SCIENCE LAB</title><style>
:root{font-family:system-ui,"Noto Sans KR",sans-serif;background:#f3f6f8;color:#172c42}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.top{background:#142b43;color:#fff;padding:20px max(20px,calc((100vw - 1200px)/2)) 28px}.top a{color:#9de3c9;text-decoration:none;font-size:13px}.top h1{font-size:clamp(26px,4vw,41px);margin:13px 0 5px}.top p{margin:0;color:#c6d7e3}.wrap{max-width:1200px;margin:22px auto;padding:0 18px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.tabs button{padding:12px 14px;border-radius:12px;border:1px solid #d7e1e6;background:#fff;font-weight:700;color:#3a5265}.tabs button.active{color:white;background:#176d70;border-color:#176d70}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.85fr);gap:16px}.panel{background:#fff;border:1px solid #dfebee;border-radius:20px;box-shadow:0 10px 30px #20324a0a;padding:20px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;color:#0b8480}.panel h2{font-size:25px;margin:7px 0 6px}.sub{color:#62798a;font-size:14px;line-height:1.6;margin:0 0 16px}canvas{width:100%;height:auto;display:block;border-radius:14px;background:#f8fbfc;touch-action:none}.legend{font-size:12px;color:#647988;margin:12px 0 0}.control{margin:17px 0}.control label{font-weight:750;font-size:14px;display:flex;justify-content:space-between;gap:10px}.control output{color:#067d79;font-variant-numeric:tabular-nums}.control input{width:100%;accent-color:#0b807e;margin:12px 0 0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#eef7f5;border-radius:12px;padding:13px}.metric small{display:block;color:#54706d;margin-bottom:6px}.metric b{font-size:19px;color:#153f45}.question{border-left:4px solid #f3a273;padding:11px 14px;background:#fff6ed;margin-top:18px;border-radius:0 9px 9px 0;font-size:14px;line-height:1.7}.note{font-size:13px;color:#566f7d;line-height:1.7;border-top:1px solid #e2ecec;padding-top:13px;margin-top:16px}.record{background:#fff;border:1px solid #d6e0e6;border-radius:9px;padding:10px 12px;margin-top:13px}.record:hover{background:#f0f8f7}.records{font-size:12px;line-height:1.7;color:#5b6e7c;max-height:160px;overflow:auto}.more{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 34px}.more a{border-radius:10px;padding:11px 14px;text-decoration:none;background:#e5edfa;color:#254c72;font-weight:700;font-size:13px}.sources{color:#617584;font-size:12px;line-height:1.8;margin:0 0 30px}.sources a{color:#176d70}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{padding:16px}.tabs button{flex:1 1 145px}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header class="top"><a href="../electricity/">← 전기·자기 탐구 지도</a><h1>전기·전자 탐구 스튜디오</h1><p>조건을 바꿔보고, 변화를 관찰하고, 숫자로 검증하는 6개의 가상실험</p></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div class="layout"><section class="panel"><div class="eyebrow" id="badge">EXPERIMENT 01</div><h2 id="title"></h2><p class="sub" id="summary"></p><canvas id="scene" width="760" height="430" aria-label="과학 원리 시각화"></canvas><p class="legend" id="legend"></p></section><aside class="panel"><div class="eyebrow">CHANGE & OBSERVE</div><h2 style="font-size:19px">실험 조건</h2><div id="controls"></div><div class="metrics" id="metrics"></div><div class="question" id="question"></div><div class="note" id="note"></div><button class="record" id="record">＋ 지금 결과 기록</button><div class="records" id="records"></div></aside></div><div class="more"><a href="./circuit-builder.html">전구·전지 회로 조립하기 ↗</a><a href="../electricity/">전체 전기·자기 개념 목록 ↗</a></div><p class="sources">과학 검토 기준: <a href="https://openstax.org/books/university-physics-volume-2/pages/5-4-electric-field" target="_blank" rel="noopener">전기장</a> · <a href="https://openstax.org/books/university-physics-volume-2/pages/10-5-rc-circuits" target="_blank" rel="noopener">RC 회로</a> · <a href="https://openstax.org/books/university-physics-volume-2/pages/13-1-faradays-law" target="_blank" rel="noopener">전자기 유도</a>. 교육용 이상화 모형이며 실제 기기 성능을 예측하는 용도가 아닙니다.</p></main>
<script>
const $=s=>document.querySelector(s),canvas=$('#scene'),g=canvas.getContext('2d'),W=760,H=430,PI=Math.PI,mu=4*PI*1e-7;
const experiments=[
{id:'charge',title:'전하 사이의 보이지 않는 힘',label:'01 · 정전기',summary:'두 점전하의 부호·크기·거리를 바꾸며 인력과 척력을 살펴봅니다.',legend:'빨강은 양전하(+), 파랑은 음전하(−)입니다. 화살표는 전하가 받는 힘의 방향입니다.',controls:[['q1','왼쪽 전하 (μC)',-5,5,1,2],['q2','오른쪽 전하 (μC)',-5,5,1,-2],['r','거리 (cm)',10,60,1,30]],question:'전하의 크기는 그대로 두고 거리를 두 배로 하면 힘은 몇 배가 될까요?',note:'점전하·진공의 쿨롱 법칙 F = k|q₁q₂|/r². 값이 0인 전하는 전기력을 받지 않습니다.'},
{id:'field',title:'전류가 만드는 자기장',label:'02 · 자기',summary:'긴 직선 도선 주변의 자기장 크기와 방향을 관찰합니다.',legend:'중앙 기호 ⊙는 화면 밖으로 향하는 전류, ⊗는 화면 안으로 향하는 전류입니다.',controls:[['current','전류 (A)',-10,10,1,5],['distance','관찰 거리 (cm)',1,25,1,8]],question:'전류 방향을 거꾸로 바꾸면 나침반 바늘은 어떤 방향으로 회전할까요?',note:'무한히 긴 직선 도선·진공 근사 B = μ₀|I|/(2πr). 전류 0이면 이 도선이 만드는 자기장은 0입니다.'},
{id:'induction',title:'자속 변화와 유도 기전력',label:'03 · 전자기 유도',summary:'코일을 통과하는 자기장이 시간에 따라 변할 때 유도 기전력이 생깁니다.',legend:'그래프는 자속 밀도 B(t)와 유도 기전력 ε(t)의 위상 차이를 나타냅니다.',controls:[['turns','코일 감은 수 N',10,200,10,80],['area','코일 면적 (cm²)',5,80,5,30],['peak','자기장 진폭 (mT)',10,200,10,100],['freq','변화 진동수 (Hz)',0,5,0.5,1]],question:'자기장이 변하지 않을 때도 코일에 유도 기전력이 생길까요?',note:'코일 면에 수직인 균일한 자기장 B(t)=B₀sin(2πft)를 가정합니다. ε(t)=−NA·dB/dt. 부호는 렌츠 법칙을 나타냅니다.'},
{id:'capacitor',title:'축전기 충전과 방전',label:'04 · 전기 회로',summary:'저항과 축전기가 연결된 회로에서 충·방전 곡선을 비교합니다.',legend:'초록색은 축전기 전압, 주황색은 저항을 흐르는 전류의 크기입니다.',controls:[['voltage','전원 전압 (V)',1,12,1,9],['resistance','저항 (kΩ)',1,20,1,5],['capacitance','전기 용량 (μF)',10,500,10,200],['mode','충전 0 / 방전 1',0,1,1,0]],question:'저항과 전기 용량을 각각 두 배로 늘리면 충·방전 시간은 어떻게 될까요?',note:'이상적인 직류 RC 회로에서 τ=RC. 충전 Vc=V(1−e^(−t/τ)), 방전 Vc=Ve^(−t/τ). 방전은 시작할 때 완전히 충전된 상태를 가정합니다.'},
{id:'ac',title:'교류와 저항·축전기',label:'05 · 교류',summary:'저항과 축전기를 직렬 연결했을 때 주파수별 전류 크기와 위상차를 확인합니다.',legend:'파랑: 전원 전압, 주황: 전류(시각화용 정규화). 축전기가 있으면 전류가 전압보다 앞섭니다.',controls:[['v','실효 전압 (V)',1,20,1,10],['R','저항 (Ω)',10,200,10,100],['C','전기 용량 (μF)',1,100,1,20],['f','진동수 (Hz)',10,1000,10,100]],question:'진동수가 높아지면 축전기의 용량 리액턴스는 어떻게 될까요?',note:'이상적인 직렬 RC 교류 회로. Xc=1/(2πfC), |Z|=√(R²+Xc²), Irms=Vrms/|Z|. 전류 위상은 전압보다 arctan(Xc/R)만큼 빠릅니다.'},
{id:'diode',title:'다이오드의 한 방향 전류',label:'06 · 반도체',summary:'정방향·역방향 전압에 대한 다이오드의 단순화된 전류–전압 특성을 비교합니다.',legend:'그래프는 이 교육용 모형의 전류–전압 특성입니다. 점은 현재 설정한 조건을 나타냅니다.',controls:[['bias','다이오드 전압 (V)',-1,0.9,0.1,0.8],['temp','온도 (°C)',0,80,5,25]],question:'다이오드에 역방향 전압을 걸면 모든 상황에서 전류가 정확히 0일까요?',note:'Shockley 식 I=Is[exp(V/(nVt))−1]의 제한된 예시 모델(Is=1 nA, n=2). 고전압·항복·직렬저항·발열은 반영하지 않았습니다.'}
];
let active=0,vals={},history=[];function line(x1,y1,x2,y2,c='#437c86',w=2){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}function circle(x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,2*PI);g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=3;g.stroke()}}function text(t,x,y,size=16,color='#20384b',align='center'){g.fillStyle=color;g.font='600 '+size+'px system-ui';g.textAlign=align;g.fillText(t,x,y)}function arrow(x1,y1,x2,y2,c='#e77757',w=4){line(x1,y1,x2,y2,c,w);let a=Math.atan2(y2-y1,x2-x1);line(x2,y2,x2-14*Math.cos(a-.5),y2-14*Math.sin(a-.5),c,w);line(x2,y2,x2-14*Math.cos(a+.5),y2-14*Math.sin(a+.5),c,w)}function grid(){g.clearRect(0,0,W,H);g.fillStyle='#f8fbfc';g.fillRect(0,0,W,H);g.strokeStyle='#e5eff1';g.lineWidth=1;for(let x=40;x<W;x+=40)line(x,30,x,H-30,'#e9f0f2',1);for(let y=30;y<H;y+=40)line(40,y,W-40,y,'#e9f0f2',1)}function fmt(v,d=2){return Number.isFinite(v)?v.toFixed(d):'—'}
function axes(x,y,w,h,xt,yt){line(x,y,x,y-h,'#8197a7',2);line(x,y,x+w,y,'#8197a7',2);text(xt,x+w-8,y+26,13,'#657986','right');text(yt,x-5,y-h-8,13,'#657986','right')}
function plot(fn,x,y,w,h,color,width=3){g.strokeStyle=color;g.lineWidth=width;g.beginPath();for(let i=0;i<=350;i++){let xx=x+i*w/350,yy=y-h*fn(i/350);i?g.lineTo(xx,yy):g.moveTo(xx,yy)}g.stroke()}
function charge(){let {q1,q2,r}=vals,k=8.9875517923e9,F=k*Math.abs(q1*q2)*1e-12/(r/100)**2,attract=q1*q2<0;line(120,220,640,220,'#b1c6cf',2);let x1=380-r*4,x2=380+r*4;circle(x1,220,35,q1>0?'#f5ae9d':q1<0?'#9ccfec':'#d5e0e5');circle(x2,220,35,q2>0?'#f5ae9d':q2<0?'#9ccfec':'#d5e0e5');text(q1>0?'+':q1<0?'−':'0',x1,230,35);text(q2>0?'+':q2<0?'−':'0',x2,230,35);if(F){let dir=attract?1:-1;arrow(x1,145,x1+dir*65,145);arrow(x2,145,x2-dir*65,145)}text(r+' cm',380,285,16);text('F = '+fmt(F,3)+' N',380,365,25);return [['쿨롱 힘',fmt(F,4)+' N'],['상호작용',F===0?'힘 없음':attract?'인력':'척력']]}
function field(){let I=vals.current,r=vals.distance/100,B=mu*Math.abs(I)/(2*PI*r),cx=380,cy=210;for(let rad=40;rad<=165;rad+=36){g.strokeStyle='#80b9b6';g.lineWidth=2;g.beginPath();g.arc(cx,cy,rad,0,2*PI);g.stroke();if(I) {let a=-.8,sign=Math.sign(I),x=cx+rad*Math.cos(a),y=cy+rad*Math.sin(a);arrow(x,y,x-sign*20*Math.sin(a),y+sign*20*Math.cos(a),'#1b8482',3)}}circle(cx,cy,25,'#153e58');text(I>0?'⊙':I<0?'⊗':'0',cx,cy+9,30,'#fff');let x=cx+r*500,y=cy;circle(x,y,10,'#ed9768');if(I){let sign=Math.sign(I);arrow(x,y,x,y+sign*76,'#e37556')}text('관찰점',x,cy-23,15);text('전류 '+I+' A',cx,70,23);return [['자기장 크기',fmt(B*1e6,2)+' μT'],['방향',I>0?'반시계':I<0?'시계':'자기장 없음']]}
function induction(){let {turns,area,peak,freq}=vals,A=area*1e-4,B=peak*1e-3,amp=turns*A*B*2*PI*freq;axes(65,350,620,245,'시간','변화');plot(t=>.5+.37*(freq?Math.sin(2*PI*t*2):0),65,350,620,245,'#257bb1');plot(t=>.5-.37*Math.cos(2*PI*t*2)*(freq?1:0),65,350,620,245,'#e48256');text('B(t)',140,85,15,'#257bb1');text('ε(t)',215,85,15,'#e48256');text('자기장이 고정되면 유도 기전력은 0',380,404,16);return [['기전력 최댓값',fmt(amp,4)+' V'],['변화 주기',freq?fmt(1/freq,3)+' s':'변화 없음']]}
function capacitor(){let {voltage,resistance,capacitance,mode}=vals,tau=resistance*1e3*capacitance*1e-6,T=5*tau;axes(62,345,630,260,'시간 t / 5τ','상대 크기');plot(x=>mode?Math.exp(-5*x):1-Math.exp(-5*x),62,345,630,255,'#168f87',4);plot(x=>Math.exp(-5*x),62,345,630,255,'#e48b52',3);for(let i=0;i<=5;i++)text(i+'τ',62+630*i/5,365,12);text('축전기 전압',155,75,15,'#168f87');text('전류 크기',302,75,15,'#e48b52');return [['시간 상수 τ',fmt(tau,3)+' s'],['초기 전류 크기',fmt(voltage/(resistance*1000)*1000,2)+' mA'],['5τ 경과 후 전압',fmt(voltage*(mode?Math.exp(-5):1-Math.exp(-5)),2)+' V']]}
function ac(){let {v,R,C,f}=vals,xc=1/(2*PI*f*C*1e-6),z=Math.hypot(R,xc),I=v/z,phase=Math.atan(xc/R);axes(65,350,615,260,'시간 / 2주기','파형');plot(t=>.5+.35*Math.sin(4*PI*t),65,350,615,250,'#2584b6',3);plot(t=>.5+.35*Math.sin(4*PI*t+phase),65,350,615,250,'#e48b52',3);text('전원 전압',140,75,15,'#2584b6');text('전류',265,75,15,'#e48b52');return [['용량 리액턴스',fmt(xc,2)+' Ω'],['전류 실효값',fmt(I*1000,1)+' mA'],['전류 선행 위상',fmt(phase*180/PI,1)+'°'],['임피던스 크기',fmt(z,2)+' Ω']]}
function diode(){let {bias,temp}=vals,vt=1.380649e-23*(temp+273.15)/1.602176634e-19,Is=1e-9,n=2,cur=v=>Is*Math.expm1(Math.min(40,v/(n*vt))),ma=cur(bias)*1000;axes(70,350,615,265,'전압 V','전류 mA');let scale=cur(.85)*1000;plot(x=>Math.min(.95,Math.max(0,cur(-1+1.85*x)*1000/scale))*.95,70,350,615,265,'#1d8c81',4);let px=70+615*(bias+1)/1.85;if(px>=70&&px<=685){let py=350-265*Math.min(.95,Math.max(0,ma/scale))*.95;circle(px,py,8,'#e57c58')}text('역방향',160,200,17,'#678195');text('정방향',575,200,17,'#678195');return [['다이오드 전류',Math.abs(ma)<.001?fmt(ma*1000,2)+' μA':fmt(ma,3)+' mA'],['동작 구간',bias>0?'정방향':bias<0?'역방향':'영전압'],['열전압 Vt',fmt(vt*1000,2)+' mV']]}
const renderers={charge,field,induction,capacitor,ac,diode};function render(){let e=experiments[active];grid();let m=renderers[e.id]();$('#metrics').innerHTML=m.map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')}
function select(i){active=i;let e=experiments[i];vals=Object.fromEntries(e.controls.map(c=>[c[0],c[5]]));$('#badge').textContent='RAON / '+e.label;$('#title').textContent=e.title;$('#summary').textContent=e.summary;$('#legend').textContent=e.legend;$('#question').textContent='생각해 보기 · '+e.question;$('#note').textContent=e.note;$('#controls').replaceChildren();e.controls.forEach(([key,label,min,max,step,value])=>{let div=document.createElement('div');div.className='control';let lab=document.createElement('label');let name=document.createElement('span');name.textContent=label;let out=document.createElement('output');out.textContent=value;lab.append(name,out);let input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.step=step;input.value=value;input.setAttribute('aria-label',label);input.oninput=()=>{vals[key]=Number(input.value);out.textContent=input.value;render()};div.append(lab,input);$('#controls').append(div)});$('#tabs').querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-selected',i===j)});history=[];$('#records').textContent='';render()}
experiments.forEach((e,i)=>{let b=document.createElement('button');b.textContent=e.label.replace(/^\d+ · /,'');b.setAttribute('role','tab');b.onclick=()=>select(i);$('#tabs').append(b)});$('#tabs').setAttribute('role','tablist');$('#record').onclick=()=>{let e=experiments[active];history.unshift(e.title+' | '+Object.entries(vals).map(([k,v])=>k+'='+v).join(', '));history=history.slice(0,8);$('#records').replaceChildren(...history.map(x=>{let p=document.createElement('p');p.textContent='• '+x;return p}))};select(0);
</script></body></html>
